[project]
name = "llm-cooperation-pilot"
version = "0.1.0"
description = "Pilot: language-model agents in the noisy repeated prisoner's dilemma"
readme = "README.md"
authors = [
    { name = "Sidhaarth Krishnan", email = "krishnansidhaarth@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
